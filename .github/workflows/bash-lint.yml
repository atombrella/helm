---
name: Lint Bash Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**.sh'

permissions:
  contents: read

jobs:
  bashlint:
    name: bashlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # pin@v6.0.1
        with:
          persist-credentials: false

      - name: Lint bash scripts with ShellCheck
        run: shellcheck ./scripts/**.sh
